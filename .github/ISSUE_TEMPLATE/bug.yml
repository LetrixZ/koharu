name: Bug report
description: Report something that is not working as expected
type: Bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Koharu! Please take a quick look at existing issues before posting.

        If AI helped substantially with this report, briefly mention how.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Tell us what went wrong and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Share the steps or a sample that shows the problem. If it only happens sometimes, tell us what you were doing.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Koharu version and operating system
      description: Include your Koharu version and OS. GPU or driver details are helpful for graphics or model issues, if you know them.
      placeholder: |
        Koharu:
        OS:
        GPU/runtime, if relevant:
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else? (optional)
      description: Screenshots or logs can help. Please remove private information before sharing.
