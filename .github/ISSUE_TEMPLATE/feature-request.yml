name: Feature request
description: Suggest an improvement to Koharu
type: Feature

body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your idea! Please take a quick look at existing issues before posting.

        Thinking of working on a larger change? Let's discuss it here first.

        If AI helped substantially with this request, briefly mention how.

  - type: textarea
    id: description
    attributes:
      label: What would you like to see?
      description: Tell us what would help and what problem it would solve. A few sentences are enough.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else? (optional)
      description: Add examples, screenshots, or how you work around this today.
